<!DOCTYPE html>
<html>
<head><title>Cutout Generator</title></head>
<body>
<canvas id="c"></canvas>
<script>
const img = new Image();
img.crossOrigin = 'anonymous';
img.src = '/images/model-bride.jpg';
img.onload = () => {
  const canvas = document.getElementById('c');
  canvas.width = img.width;
  canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imgData.data;

  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2];

    // High studio white / light grey background threshold
    if (r > 228 && g > 225 && b > 225) {
      data[i + 3] = 0; // 100% transparent
    } else if (r > 215 && g > 212 && b > 212) {
      // Soft feathering edge for hair and lace details
      const opacity = Math.min(255, Math.max(0, Math.round(((228 - r) / 13) * 255)));
      data[i + 3] = opacity;
    }
  }
  ctx.putImageData(imgData, 0, 0);
  window.CUTOUT_DONE = true;
  window.CUTOUT_DATA = canvas.toDataURL('image/png');
  document.body.innerHTML = '<h1>CUTOUT_READY</h1>';
};
</script>
</body>
</html>
